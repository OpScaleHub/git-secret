name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      # true when something that can affect build/test/chart changed, or on
      # any push to main (so main is always fully verified regardless of the
      # merge's diff).
      code: ${{ steps.filter.outputs.code == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'charts/**'
              - 'config/**'
              - 'Dockerfile*'
              - '.github/workflows/**'
              - '.github/dependabot.yml'

  test:
    name: Build, vet, test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'

      - name: Configure git identity (needed by integration tests)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      # Linux: the GPG-dependent suites must actually execute (not silently
      # t.Skip -- see internal/gpgutil TestGPGSuiteFloor), and we run the
      # race detector here. macOS/Windows skip the GPG suites by design.
      - name: Test (Linux — race + GPG required)
        if: runner.os == 'Linux'
        env:
          REQUIRE_GPG_TESTS: '1'
        run: go test ./... -race -v

      - name: Test (macOS / Windows)
        if: runner.os != 'Linux'
        run: go test ./... -v

  security-scan:
    name: Vulnerability & config scan (advisory)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'

      - name: govulncheck
        continue-on-error: true # advisory for now
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Trivy (filesystem — vuln, misconfig, secret)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true # advisory for now
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'

  chart:
    name: Lint & render Helm chart
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: helm lint
        run: |
          # git-secret-server is deprecated (superseded by the GitSecret CRD +
          # git-secret-controller); still linted so it keeps building for
          # existing ESO users, not because it is a recommended path.
          helm lint ./charts/git-secret-server
          helm lint ./charts/git-secret-controller

      - name: helm template (with required values set, to render every template)
        run: |
          helm template test ./charts/git-secret-server \
            --set repo.url=git@github.com:example/repo.git \
            --set sshKey.existingSecret=dummy-ssh \
            --set gpgPrivateKey.existingSecret=dummy-gpg \
            --set authToken.existingSecret=dummy-token
          helm template test ./charts/git-secret-controller \
            --set gpgPrivateKey.existingSecret=dummy-gpg \
            --include-crds

  ci-status:
    name: CI status
    # Single stable check to gate merges on: passes when the heavy jobs
    # passed OR were legitimately skipped (docs-only change), fails if any
    # actually failed or was cancelled. Make this the required status check
    # in branch protection instead of the per-OS matrix legs.
    if: always()
    needs: [changes, test, chart]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "test:  ${{ needs.test.result }}"
          echo "chart: ${{ needs.chart.result }}"
          for r in "${{ needs.test.result }}" "${{ needs.chart.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "a required job did not succeed"
              exit 1
            fi
          done
          echo "ok"
