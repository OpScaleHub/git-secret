name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      # true when something that can affect build/test/chart changed, or on
      # any push to main (so main is always fully verified regardless of the
      # merge's diff).
      code: ${{ steps.filter.outputs.code == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'charts/**'
              - 'config/**'
              - 'Dockerfile*'
              - '.github/workflows/**'
              - '.github/dependabot.yml'

  test:
    name: Build, vet, test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Configure git identity (needed by integration tests)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: CRD manifests match the Go types
        if: runner.os == 'Linux'
        run: |
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.19.0 \
            crd paths=./api/... output:crd:dir=config/crd/bases
          cp config/crd/bases/keyfold.opscalehub.io_gitsecrets.yaml \
            charts/keyfold/crds/gitsecret.yaml
          git diff --exit-code -- config/crd charts/keyfold/crds || {
            echo "::error::CRD is stale: regenerate with controller-gen v0.19.0 and copy it into the chart (see CONTRIBUTING.md)"; exit 1; }

      # Linux: the GPG-dependent suites must actually execute (not silently
      # t.Skip -- see internal/gpgutil TestGPGSuiteFloor), and we run the
      # race detector here. macOS/Windows skip the GPG suites by design.
      - name: Test (Linux — race + GPG required)
        if: runner.os == 'Linux'
        env:
          REQUIRE_GPG_TESTS: '1'
        run: go test ./... -race -v

      - name: Test (macOS / Windows)
        if: runner.os != 'Linux'
        run: go test ./... -v

  security-scan:
    name: Vulnerability & config scan (advisory)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: govulncheck
        continue-on-error: true # advisory for now
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Trivy (filesystem — vuln, misconfig, secret)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true # advisory for now
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'

  chart:
    name: Lint & render Helm chart
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: helm lint
        run: |
          helm lint ./charts/keyfold

      - name: helm template (with required values set, to render every template)
        run: |
          helm template test ./charts/keyfold \
            --set gpgPrivateKey.existingSecret=dummy-gpg \
            --include-crds

      - name: chart invariants (Pod Security, selectors, naming, required values)
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyyaml
          all=$(helm template keyfold ./charts/keyfold \
            --set gpgPrivateKey.existingSecret=dummy-gpg \
            --set webhook.enabled=true --set servePubKey.enabled=true \
            --set publishPublicKey.enabled=true \
            --set sealUi.enabled=true --set sealUi.keyringConfigMap=kr)
          python3 - "$all" <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.argv[1]) if d]
          pods = {d["metadata"]["name"]: d for d in docs if d["kind"] in ("Deployment", "Job")}
          fail = []
          for name, d in pods.items():
              spec = d["spec"]["template"]["spec"]
              if (spec.get("securityContext") or {}).get("seccompProfile", {}).get("type") != "RuntimeDefault":
                  fail.append(f"{name}: pod lacks seccompProfile RuntimeDefault (Pod Security restricted)")
          labels = {n: d["spec"]["template"]["metadata"]["labels"] for n, d in pods.items()}
          for d in docs:
              sel = d["spec"]["selector"] if d["kind"] == "Service" else \
                    d["spec"]["selector"]["matchLabels"] if d["kind"] == "Deployment" else None
              if sel is None:
                  continue
              hits = [n for n, l in labels.items() if all(l.get(k) == v for k, v in sel.items())]
              if len(hits) != 1:
                  fail.append(f"{d['kind']} {d['metadata']['name']} selects {hits}, want exactly one workload")
          if "keyfold" not in pods:
              fail.append(f"release 'keyfold' should render a Deployment named 'keyfold', got {sorted(pods)}")
          print("\n".join(fail) or f"ok: {len(pods)} workloads, all restricted-compatible, selectors disjoint")
          sys.exit(1 if fail else 0)
          PY
          if helm template t ./charts/keyfold \
               --set gpgPrivateKey.existingSecret=dummy-gpg --set sealUi.enabled=true >/dev/null 2>&1; then
            echo "sealUi.enabled without sealUi.keyringConfigMap must fail to render"; exit 1
          fi

  ci-status:
    name: CI status
    # Single stable check to gate merges on: passes when the heavy jobs
    # passed OR were legitimately skipped (docs-only change), fails if any
    # actually failed or was cancelled. Make this the required status check
    # in branch protection instead of the per-OS matrix legs.
    if: always()
    needs: [changes, test, chart]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "test:  ${{ needs.test.result }}"
          echo "chart: ${{ needs.chart.result }}"
          for r in "${{ needs.test.result }}" "${{ needs.chart.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "a required job did not succeed"
              exit 1
            fi
          done
          echo "ok"
