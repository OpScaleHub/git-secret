name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build, vet, test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Configure git identity (needed by integration tests)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

  chart:
    name: Lint & render Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint ./charts/git-secret-server

      - name: helm template (with required values set, to render every template)
        run: |
          helm template test ./charts/git-secret-server \
            --set repo.url=git@github.com:example/repo.git \
            --set sshKey.existingSecret=dummy-ssh \
            --set gpgPrivateKey.existingSecret=dummy-gpg \
            --set authToken.existingSecret=dummy-token
