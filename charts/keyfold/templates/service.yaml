apiVersion: v1
kind: Service
metadata:
  name: {{ include "keyfold.fullname" . }}-metrics
  labels:
    {{- include "keyfold.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "keyfold.controllerSelectorLabels" . | nindent 4 }}
