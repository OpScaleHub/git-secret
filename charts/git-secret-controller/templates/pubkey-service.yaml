{{- if .Values.servePubKey.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "git-secret-controller.fullname" . }}-pubkey
  labels:
    {{- include "git-secret-controller.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "git-secret-controller.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: pubkey
      protocol: TCP
{{- end }}
