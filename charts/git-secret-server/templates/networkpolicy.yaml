{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "git-secret-server.fullname" . }}
  labels:
    {{- include "git-secret-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "git-secret-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.allowFrom | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
