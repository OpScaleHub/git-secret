{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "git-secret-server.serviceAccountName" . }}
  labels:
    {{- include "git-secret-server.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No automountServiceAccountToken permissions are needed -- this
# service never talks to the Kubernetes API itself (ESO is the one
# that writes the resulting Secret), so the default token isn't used.
automountServiceAccountToken: false
{{- end }}
