apiVersion: v2
name: git-secret-server
description: >-
  DEPRECATED. Stateless HTTP bridge letting External Secrets Operator's generic
  Webhook provider pull decrypted values out of a git-secret-protected
  repository. Superseded by the native GitSecret CRD + git-secret-controller
  (chart: git-secret-controller). Retained for existing ESO users; receives
  security fixes only, no new features. New deployments should use the CRD.
type: application
deprecated: true
version: 0.1.0
appVersion: "0.1.0"
home: https://git-secret.opscale.ir
sources:
  - https://github.com/OpScaleHub/git-secret
keywords:
  - secrets
  - external-secrets-operator
  - gitops
maintainers:
  - name: OpScaleHub
